<!DOCTYPE html>
<html lang="pl-PL">
  <head>
   <meta charset="utf-8">
   <title>Maciej Huba klasa 3F - zadanie 7 (Alert Box)</title>
   <script type="text/javascript"> function show_alert() { alert("Uwaga!"); } </script>
   <script type="text/javascript"> function okno_zamknij_huba() { window.close() } </script>
  </head>
<body>
     <h2>Zadanie 7 - Alert Box</h2>
     <b>Zastosowanie:</b><br>
     Jest używany do przekazywania informacji użytkownikowi. Użytkownik musi nacisnąć OK, aby
     potwierdzić jej przeczytanie.<br><br>

     <input type="button" onclick="show_alert()" value="Pokaż Alert Box" />
     <br><br>
     <input type="button" value="zamknij okno" onclick="okno_zamknij_huba()"/>
</body>
</html>
