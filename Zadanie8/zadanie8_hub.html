<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Maciej Huba klasa 3F - zadanie 8 (Confirm Box)</title>
<script type="text/javascript">

  function show_confirm()
    {
      var r=confirm("Naciśnij klawisz");
       if (r==true)
          { document.write("Nacisnąłeś OK!"); }
       else
        { document.write("Nacisnąłeś Cancel!"); }
    }

  function okno_zamknij_huba()
    {
      window.close()
    }

</script>
</head>
<body>
   <h2>Zadanie 8 - Confirm Box</h2>
   <b>Zastosowanie:</b><br>
   Jest używany, jeśli chcemy zapytać użytkownika o weryfikację lub akceptację jakichś danych.
   Użytkownik musi nacisnąć „OK" w celu akceptacji bądź „Cancel" w celu odrzucenia. Jeżeli zostanie
   wybrane „OK" metoda zwraca true, w przeciwnym wypadku false.<br><br>

   <input type="button" onclick="show_confirm()" value="Pokaż confirm box" />
   <br><br>
   <input type="button" value="zamknij okno" onclick="okno_zamknij_huba()"/>
</body>
</html>
