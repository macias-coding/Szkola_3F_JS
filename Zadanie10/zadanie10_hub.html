<!DOCTYPE html>
<html lang="pl-PL">
  <head>
      <title>proste obliczenia - Maciej Huba klasa 3F</title>
      <meta charset="utf-8">
      <script type="text/javascript">
        function okno_zamknij_huba()
          {
            window.close()
          }
      </script>
   </head>

<body>
         <div style="color:red;font-size:50px;">
           <script language="JavaScript">
                   var liczba1=prompt("liczba1=","");
                   var liczba2=prompt("liczba2=","");
                   var suma;
                   var a=parseFloat(liczba1);
                   var b=parseFloat(liczba2);
                    suma=a+b;
                    document.write("suma="+a+" + "+b+" = "+suma+"<br>");
            </script>
         </div>

         <input type="button" value="zamknij okno" onclick="okno_zamknij_huba()"/>
</body>
</html>
