 <div style="color:navy;font-size:34px;">

  <script language="JavaScript">
// Maciej Huba 3F 23.10.2026
// Zadanie 16

   var A_hub=prompt("Podaj pierwszą liczbę    A=","");
   var B_hub=prompt("Podaj drugą liczbę    B=","");
   var a=parseInt(A_hub);
   var b=parseInt(B_hub);
   var s1=a*a*a;
   var s2=3*a*a*b;
   var s3=3*a*b*b;
   var s4=b*b*b;
   var wynik=s1+s2+s3+s4;
   document.write("wczytane liczby: &nbsp; A="+a+" &nbsp; &nbsp; B="+b+"<br><br>");
   document.write("("+a+" + "+b+")^3= "+a+"^3 + 3*(("+a+")^2)*("+b+") + 3*("+a+")*(("+b+")^2) + "+b+"^3 = "+s1+" + "+s2+" + "+s3+" + "+s4+" = "+wynik+"<br>");

     function okno_zamknij_huba()
     {
       window.close()
     }
  </script>
 </div>
 <input type="button" value="zamknij okno" onclick="okno_zamknij_huba()"/>
 </body>
