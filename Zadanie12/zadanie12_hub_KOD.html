<html>

  <title>Maciej Huba klasa 3F - zadanie 12 (Ile sekund - modyfikacja)</title>
 </head>
 <body>
 <div style="color:green;font-size:46px;">

  <script language="JavaScript">
// Maciej Huba 3F 23.10.2026
// Zadanie 12

   var D1_hub=prompt("Data1=","");
   var G1_hub=prompt("Godzina1=","");
   var D2_hub=prompt("Data2=","");
   var G2_hub=prompt("Godzina2=","");
   var sekund;
   var a=parseFloat(D1_hub);
   var g1=parseFloat(G1_hub);
   var b=parseFloat(D2_hub);
   var g2=parseFloat(G2_hub);
     sekund=((a-b)*24+(g1-g2))*60*60;
   document.write("Ilość sekund między dniem "+a+" godz. "+g1+" i dniem "+b+" godz. "+g2+" = "+sekund+"<br>");

     function okno_zamknij_huba()
     {
       window.close()
     }
  </script>
 </div>
 <input type="button" value="zamknij okno" onclick="okno_zamknij_huba()"/>
 </body>
